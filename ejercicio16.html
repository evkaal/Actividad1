<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Funciones Flecha</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="css/ejercicio16.css">
   
   
</head>
<body>

    <div class="calculadora">
        <h2>Calculadora</h2>
        
        <label for="numero1">Número 1:</label>
        <input type="text" id="numero1" placeholder="Ingresa el primer número">
        
        <label for="numero2">Número 2:</label>
        <input type="text" id="numero2" placeholder="Ingresa el segundo número">
        
        <div class="botones">
            <button onclick="calcularOperacion('suma')">Sumar (+)</button>
            <button onclick="calcularOperacion('resta')">Restar (-)</button>
            <button onclick="calcularOperacion('multiplicacion')">Multiplicar (*)</button>
            <button onclick="calcularOperacion('division')">Dividir (/)</button>
        </div>
        
        <label for="resultado">Resultado:</label>
        <input type="text" id="resultado" readonly placeholder="El resultado aparecerá aquí">
    </div>

    <script src="js/ejercicio16.js"></script>
</body>
</html>
